<style>
/* Layout: sticky loop-map TOC on the left, one reading column; code reads as a terminal in both themes. */
:root {

  --surface: #FFFFFF;
  --ink: #131A2C;
  --muted: #5A637B;
  --line: #D8DDE9;

  --accent-soft: #E3E8FC;
  --signal: #B45309;
  --signal-soft: #FBEEDC;
  --ok: #15803D;
  --ok-soft: #DDF3E4;
  --bad: #B91C1C;
  --bad-soft: #FBE3E3;
  --term-bg: #0E1424;
  --term-fg: #D5DDF0;
  --term-dim: #7D88A6;
  --term-line: #1F2840;
  --hl-key: #9DB0FF;
  --hl-str: #F2C27B;
  --hl-num: #7FD6B0;
  --hl-com: #6E7896;
  --hl-fn: #E9A2D6;
  --c1: #2E49D6; --c2: #6D3FD6; --c3: #0F8A82; --c4: #C42F6B; --c5: #B45309; --c6: #15803D;
  --f-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0C101B; --surface: #131A2A; --ink: #E5E9F4; --muted: #97A1B9; --line: #252E45;
    --accent: #8EA3FF; --accent-soft: #1B2447; --signal: #F4B457; --signal-soft: #2E2312;
    --ok: #5DD39A; --ok-soft: #10291D; --bad: #FF8A8A; --bad-soft: #321616;
    --term-bg: #070A12; --term-line: #1A2236;
    --c1: #8EA3FF; --c2: #B49CFF; --c3: #4FD1C5; --c4: #FF7AAE; --c5: #F4B457; --c6: #5DD39A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0C101B; --surface: #131A2A; --ink: #E5E9F4; --muted: #97A1B9; --line: #252E45;
  --accent: #8EA3FF; --accent-soft: #1B2447; --signal: #F4B457; --signal-soft: #2E2312;
  --ok: #5DD39A; --ok-soft: #10291D; --bad: #FF8A8A; --bad-soft: #321616;
  --term-bg: #070A12; --term-line: #1A2236;
  --c1: #8EA3FF; --c2: #B49CFF; --c3: #4FD1C5; --c4: #FF7AAE; --c5: #F4B457; --c6: #5DD39A;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } *, *::before, *::after { animation: none !important; transition: none !important; } }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--f-body); font-size: 16.5px; line-height: 1.7;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-font-smoothing: antialiased;
}
::selection { background: var(--accent); color: var(--surface); }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 4px; }

/* progress bar */
.progress { position: fixed; top: 0; left: 0; right: 0; height: calc(3px + env(safe-area-inset-top, 0px)); z-index: 20; pointer-events: none; }
.progress span { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--accent), var(--signal)); transform-origin: left; }

/* hero */
.hero { max-width: 1180px; margin: 0 auto; padding-block: 56px 40px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 40px; align-items: center; }
.hero h1 { font-family: var(--f-display); font-weight: 800; font-size: clamp(2.1rem, 5.2vw, 3.9rem); line-height: 1.02; letter-spacing: -0.025em; margin: 0; text-wrap: balance; }
.hero h1 .eyebrow { display: inline-block; font-family: var(--f-mono); font-weight: 600; font-size: 0.8rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent); background: var(--accent-soft); padding: 4px 10px; border-radius: 6px; margin-bottom: 18px; }
.hero h1 .rest { display: block; }
.meta { list-style: none; padding: 0; margin: 26px 0 0; display: flex; flex-wrap: wrap; gap: 10px; }
.meta li { font-size: 0.86rem; line-height: 1.45; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; color: var(--muted); max-width: 100%; }
.meta li strong { color: var(--ink); font-weight: 600; }

/* orbit ornament: the loop */
.orbit { width: 220px; aspect-ratio: 1; max-width: 100%; position: relative; }
.orbit::before { content: ""; position: absolute; inset: 0; border-radius: 50%; border: 1.5px dashed var(--line); }
.orbit::after { content: ""; position: absolute; inset: 34px; border-radius: 50%; border: 1.5px solid var(--accent); opacity: .35; }
.orbit .dot { position: absolute; inset: 0; animation: spin 6s linear infinite; }
.orbit .dot::before { content: ""; position: absolute; top: -7px; left: calc(50% - 7px); width: 14px; height: 14px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 6px var(--accent-soft); }
.orbit .core { position: absolute; inset: 78px; border-radius: 50%; background: var(--signal); box-shadow: 0 0 0 10px var(--signal-soft); animation: pulse 6s ease-in-out infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes pulse { 0%, 85%, 100% { transform: scale(1); } 92% { transform: scale(1.15); } }

/* shell */
.shell { max-width: 1180px; margin: 0 auto; display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 56px; padding-block: 0 96px; }
.toc { position: sticky; top: calc(24px + env(safe-area-inset-top, 0px)); align-self: start; max-height: calc(100vh - 48px); overflow-y: auto; padding-right: 6px; }
.toc summary { font-family: var(--f-mono); font-size: 0.72rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); cursor: pointer; list-style: none; padding-block: 6px; }
.toc summary::-webkit-details-marker { display: none; }
.toc ol { list-style: none; margin: 8px 0 0; padding: 0; border-left: 2px solid var(--line); }
.toc a { display: block; padding: 6px 0 6px 14px; margin-left: -2px; border-left: 2px solid transparent; color: var(--muted); text-decoration: none; font-size: 0.9rem; line-height: 1.35; transition: color .15s, border-color .15s; }
.toc a:hover { color: var(--ink); }
.toc a.active { color: var(--accent); border-left-color: var(--accent); font-weight: 500; }
.toc a.sub { padding-left: 28px; font-size: 0.82rem; }

/* article */
article { min-width: 0; max-width: 780px; }
article > * { margin-block: 0 1.1em; }
article h2 { font-family: var(--f-display); font-weight: 800; font-size: clamp(1.6rem, 3.2vw, 2.2rem); line-height: 1.12; letter-spacing: -0.02em; margin: 2.6em 0 0.8em; padding-top: 1em; border-top: 1px solid var(--line); text-wrap: balance; scroll-margin-top: 24px; }
article h2:first-of-type { margin-top: 0.4em; }
article h3 { font-family: var(--f-display); font-weight: 700; font-size: 1.32rem; line-height: 1.25; letter-spacing: -0.01em; margin: 2em 0 0.6em; text-wrap: balance; scroll-margin-top: 24px; }
article h4 { font-family: var(--f-mono); font-weight: 600; font-size: 0.95rem; margin: 1.8em 0 0.5em; color: var(--ink); scroll-margin-top: 24px; }
.num { display: inline-block; font-family: var(--f-mono); font-weight: 600; color: var(--accent); margin-right: 0.35em; font-size: 0.72em; vertical-align: 0.18em; letter-spacing: 0; }
article h3 .num { font-size: 0.78em; vertical-align: 0.08em; }
article p, article li { max-width: 68ch; }
article strong { font-weight: 600; }
article ul, article ol { padding-left: 1.3em; }
article li { margin-block: 0.3em; }
article li::marker { color: var(--accent); }
hr { border: 0; height: 1px; background: var(--line); margin: 2.4em 0; }
hr:has(+ h2), hr:first-child { display: none; }

code { font-family: var(--f-mono); font-size: 0.86em; background: var(--accent-soft); color: var(--ink); padding: 0.1em 0.38em; border-radius: 5px; overflow-wrap: anywhere; }

/* terminal code blocks */
.code { position: relative; background: var(--term-bg); border-radius: 12px; border: 1px solid var(--term-line); margin-block: 0 1.4em; overflow: hidden; }
.code-bar { display: flex; align-items: center; gap: 8px; padding: 9px 12px 9px 14px; border-bottom: 1px solid var(--term-line); }
.code-bar i { width: 10px; height: 10px; border-radius: 50%; background: var(--term-line); display: block; }
.code-bar .lang { margin-left: 6px; font-family: var(--f-mono); font-size: 0.72rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--term-dim); flex: 1; }
.code-bar button { font-family: var(--f-mono); font-size: 0.72rem; color: var(--term-dim); background: transparent; border: 1px solid var(--term-line); border-radius: 6px; padding: 3px 9px; cursor: pointer; }
.code-bar button:hover { color: var(--term-fg); border-color: var(--term-dim); }
.code pre { margin: 0; padding: 16px 18px 18px; overflow-x: auto; }
.code pre code { background: none; padding: 0; color: var(--term-fg); font-size: 0.82rem; line-height: 1.6; overflow-wrap: normal; white-space: pre; border-radius: 0; }
.hljs-keyword, .hljs-built_in, .hljs-literal { color: var(--hl-key); }
.hljs-string { color: var(--hl-str); }
.hljs-number { color: var(--hl-num); }
.hljs-comment { color: var(--hl-com); font-style: italic; }
.hljs-title, .hljs-title.function_ { color: var(--hl-fn); }
.hljs-meta { color: var(--hl-num); }
.hljs-params { color: var(--term-fg); }

/* tables */
.table-wrap { overflow-x: auto; margin-block: 0 1.5em; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 0.9rem; line-height: 1.5; font-variant-numeric: tabular-nums; }
th { text-align: left; font-family: var(--f-mono); font-size: 0.72rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); background: var(--bg); padding: 11px 14px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 11px 14px; border-bottom: 1px solid var(--line); vertical-align: top; min-width: 120px; }
tr:last-child td { border-bottom: 0; }
tbody tr:hover td { background: var(--accent-soft); }
td code { font-size: 0.82em; }

/* callouts */
blockquote { margin-inline: 0; padding: 14px 18px; background: var(--signal-soft); border-radius: 12px; border: 1px solid color-mix(in srgb, var(--signal) 30%, transparent); }
blockquote p { margin: 0; }
blockquote strong:first-child { color: var(--signal); }

/* scenarios */
.scenario { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 22px 24px 18px; margin-block: 0 22px; }
.scenario > * { margin-block: 0 0.9em; }
.scenario-head { font-family: var(--f-display); font-size: 1.18rem; line-height: 1.3; }
.scenario-head strong { font-weight: 700; }
.options { list-style: none; padding: 0; display: grid; gap: 8px; }
.options li { max-width: none; margin: 0; display: flex; gap: 12px; align-items: baseline; padding: 10px 14px; border: 1px solid var(--line); border-radius: 10px; cursor: pointer; transition: border-color .15s, background .15s; }
.options li:hover { border-color: var(--accent); }
.opt-key { flex: none; font-family: var(--f-mono); font-weight: 600; font-size: 0.85rem; color: var(--accent); }
.options li.correct { border-color: var(--ok); background: var(--ok-soft); }
.options li.correct .opt-key { color: var(--ok); }
.options li.wrong { border-color: var(--bad); background: var(--bad-soft); }
.options li.wrong .opt-key { color: var(--bad); }
.answer summary { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-family: var(--f-mono); font-size: 0.78rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); padding: 6px 12px; border: 1px dashed var(--accent); border-radius: 8px; list-style: none; }
.answer summary::-webkit-details-marker { display: none; }
.answer[open] summary { display: none; }
.answer p { margin: 0; padding: 12px 16px; background: var(--ok-soft); border-radius: 10px; max-width: none; }
.answer p > strong:first-child { color: var(--ok); }

/* ---------- colour + pill layer ---------- */
.hero { position: relative; }
.hero::before { content: ""; position: absolute; inset: 0 -10% 0 -10%; z-index: -1; pointer-events: none;
  background:
    radial-gradient(40% 60% at 8% 30%, color-mix(in srgb, var(--c2) 16%, transparent), transparent 70%),
    radial-gradient(35% 55% at 70% 20%, color-mix(in srgb, var(--c3) 14%, transparent), transparent 70%),
    radial-gradient(30% 50% at 92% 80%, color-mix(in srgb, var(--c4) 12%, transparent), transparent 70%); }
.hero h1 .rest { background: linear-gradient(100deg, var(--ink) 30%, var(--c2) 75%, var(--c4)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.hero h1 .eyebrow { border-radius: 999px; padding: 5px 14px; }
.meta li { border-radius: 999px; padding: 7px 16px; }
.meta li:nth-child(1) { background: color-mix(in srgb, var(--c1) 12%, var(--surface)); border-color: color-mix(in srgb, var(--c1) 35%, transparent); }
.meta li:nth-child(2) { background: color-mix(in srgb, var(--c2) 12%, var(--surface)); border-color: color-mix(in srgb, var(--c2) 35%, transparent); }
.meta li:nth-child(3) { background: color-mix(in srgb, var(--c3) 12%, var(--surface)); border-color: color-mix(in srgb, var(--c3) 35%, transparent); }
.meta li:nth-child(1) strong { color: var(--c1); }
.meta li:nth-child(2) strong { color: var(--c2); }
.meta li:nth-child(3) strong { color: var(--c3); }

.sec { --sec: var(--c1); --sec-soft: color-mix(in srgb, var(--sec) 13%, var(--surface)); }
.sec > h2 { border-top: 0; padding-top: 0; position: relative; }
.sec > h2::before { content: ""; display: block; height: 4px; width: 100%; border-radius: 999px; margin-bottom: 1.1em;
  background: linear-gradient(90deg, var(--sec), color-mix(in srgb, var(--sec) 10%, transparent)); }
.sec h2 .num { background: var(--sec); color: var(--surface); padding: 3px 12px; border-radius: 999px; font-size: 0.58em; vertical-align: 0.3em; margin-right: 0.5em; }
.sec h3 .num { background: var(--sec-soft); color: var(--sec); padding: 2px 10px; border-radius: 999px; font-size: 0.7em; vertical-align: 0.12em; }
.sec h4 { display: inline-block; background: var(--sec-soft); color: var(--sec); padding: 5px 14px; border-radius: 999px; border: 1px solid color-mix(in srgb, var(--sec) 30%, transparent); }
.sec h4 code { background: transparent; border: 0; color: inherit; padding: 0; }
.sec li::marker { color: var(--sec); }
.sec .table-wrap { border-color: color-mix(in srgb, var(--sec) 28%, var(--line)); }
.sec th { background: var(--sec-soft); color: var(--sec); }
.sec tbody tr:nth-child(even) td { background: color-mix(in srgb, var(--sec) 4%, var(--surface)); }
.sec tbody tr:hover td { background: var(--sec-soft); }

/* numbered lists as pill counters */
.sec ol { list-style: none; padding-left: 0; counter-reset: n; display: grid; gap: 10px; }
.sec ol > li { counter-increment: n; position: relative; padding-left: 44px; margin: 0; }
.sec ol > li::before { content: counter(n); position: absolute; left: 0; top: 0.12em; min-width: 30px; height: 26px; display: grid; place-items: center;
  border-radius: 999px; background: var(--sec); color: var(--surface); font-family: var(--f-mono); font-size: 0.78rem; font-weight: 600; }

/* inline code pills, colour-coded by meaning */
article :not(pre) > code { border-radius: 999px; padding: 0.08em 0.6em; border: 1px solid var(--line); background: var(--surface);
  -webkit-box-decoration-break: clone; box-decoration-break: clone; white-space: normal; }
code.k-ok   { color: var(--c6); background: color-mix(in srgb, var(--c6) 12%, var(--surface)); border-color: color-mix(in srgb, var(--c6) 35%, transparent); }
code.k-bad  { color: var(--c4); background: color-mix(in srgb, var(--c4) 11%, var(--surface)); border-color: color-mix(in srgb, var(--c4) 35%, transparent); }
code.k-tool { color: var(--c1); background: color-mix(in srgb, var(--c1) 11%, var(--surface)); border-color: color-mix(in srgb, var(--c1) 35%, transparent); }
code.k-cap  { color: var(--c5); background: color-mix(in srgb, var(--c5) 12%, var(--surface)); border-color: color-mix(in srgb, var(--c5) 35%, transparent); }
code.k-msg  { color: var(--c2); background: color-mix(in srgb, var(--c2) 11%, var(--surface)); border-color: color-mix(in srgb, var(--c2) 35%, transparent); }
code.k-fn   { color: var(--c3); background: color-mix(in srgb, var(--c3) 11%, var(--surface)); border-color: color-mix(in srgb, var(--c3) 35%, transparent); }
.legend { display: flex; flex-wrap: wrap; gap: 8px; margin: 22px 0 0; padding: 0; list-style: none; }
.legend li { font-family: var(--f-mono); font-size: 0.72rem; }
.legend code { font-size: 0.72rem; }

/* code bar language pill */
.code-bar .lang { flex: 0 0 auto; padding: 2px 10px; border-radius: 999px; background: var(--term-line); }
.code-bar .lang.python { color: var(--c2); }
.code-bar .lang.bash { color: var(--c3); }
.code-bar .spacer { flex: 1; }
.code-bar button { border-radius: 999px; padding: 3px 12px; }
.code-bar i:nth-child(1) { background: #E5626A; } .code-bar i:nth-child(2) { background: #E6B450; } .code-bar i:nth-child(3) { background: #5DBE7E; }

/* TOC dots */
.toc a { display: flex; gap: 10px; align-items: baseline; }
.toc a .dot { flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--sec, var(--line)); transform: translateY(-1px); }
.toc a.sub .dot { width: 5px; height: 5px; opacity: .7; }
.toc a.active { background: color-mix(in srgb, var(--sec, var(--accent)) 12%, transparent); border-radius: 0 999px 999px 0; color: var(--sec, var(--accent)); border-left-color: var(--sec, var(--accent)); }

/* scenarios & answers */
.scenario { border-color: color-mix(in srgb, var(--sec) 30%, var(--line)); background:
  linear-gradient(160deg, color-mix(in srgb, var(--sec) 7%, var(--surface)), var(--surface) 45%); }
.scenario-head .pill { display: inline-block; font-family: var(--f-mono); font-size: 0.72rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase;
  background: var(--sec); color: var(--surface); padding: 4px 12px; border-radius: 999px; vertical-align: 0.2em; margin-right: 8px; }
.options li { border-radius: 999px; padding: 10px 18px; }
.opt-key { display: inline-grid; place-items: center; min-width: 30px; height: 24px; border-radius: 999px; background: color-mix(in srgb, var(--sec) 14%, var(--surface)); color: var(--sec); font-size: 0.78rem; }
.options li.correct .opt-key { background: var(--ok); color: var(--surface); }
.options li.wrong .opt-key { background: var(--bad); color: var(--surface); }
.answer summary { border-radius: 999px; padding: 7px 16px; border-color: var(--sec); color: var(--sec); }
.answer p { border-radius: 16px; }
.answer p > strong:first-child { background: var(--ok); color: var(--surface); padding: 2px 10px; border-radius: 999px; }
blockquote { border-radius: 18px; }
blockquote strong:first-child { background: var(--signal); color: var(--surface); padding: 1px 10px; border-radius: 999px; }

.ex-hint { font-family: var(--f-mono); font-size: 0.75rem; color: var(--muted); margin-top: -4px; }

@media (max-width: 1000px) {
  .shell { grid-template-columns: minmax(0, 1fr); gap: 8px; }
  .toc { position: static; max-height: none; border: 1px solid var(--line); border-radius: 12px; padding: 8px 14px; background: var(--surface); }
  .hero { grid-template-columns: minmax(0, 1fr); padding-block: 36px 24px; }

}
@media (max-width: 520px) {
  body { font-size: 15.5px; }
  .scenario { padding: 18px 16px 12px; }
}
</style>

<div class="progress" aria-hidden="true"><span id="bar"></span></div>
<header class="hero" id="hero">
  <div id="hero-text"></div>
  <div class="orbit" aria-hidden="true"><div class="dot"></div><div class="core"></div></div>
</header>
<div class="shell">
  <nav class="toc" aria-label="Contents">
    <details id="toc-details" open>
      <summary>Contents</summary>
      <ol id="toc"></ol>
    </details>
  </nav>
  <article id="article"></article>
</div>

<script type="text/markdown" id="src">__MARKDOWN__</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script>
(function () {
  const art = document.getElementById('article');
  art.innerHTML = marked.parse(document.getElementById('src').textContent, { gfm: true });

  // Hero: move h1 + metadata blockquote
  const heroText = document.getElementById('hero-text');
  const h1 = art.querySelector('h1');
  if (h1) {
    const t = h1.innerHTML; const i = t.indexOf(': ');
    h1.innerHTML = i > -1 ? '<span class="eyebrow">' + t.slice(0, i + 1) + '</span><span class="rest">' + t.slice(i + 2) + '</span>' : t;
    heroText.appendChild(h1);
    const bq = art.firstElementChild;
    if (bq && bq.tagName === 'BLOCKQUOTE') {
      const ul = document.createElement('ul'); ul.className = 'meta';
      bq.querySelector('p').innerHTML.split('\n').forEach(function (line) {
        if (!line.trim()) return; const li = document.createElement('li'); li.innerHTML = line; ul.appendChild(li);
      });
      heroText.appendChild(ul); bq.remove();
    }
  }

  // Headings: number badges, ids, TOC
  const toc = document.getElementById('toc');
  const used = {};
  art.querySelectorAll('h2, h3, h4').forEach(function (h) {
    const text = h.textContent;
    let id = text.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
    if (used[id]) id += '-' + (++used[id]); else used[id] = 1;
    h.id = id;
    const m = h.innerHTML.match(/^(\d+(?:\.\d+)*\.?)\s/);
    if (m) h.innerHTML = '<span class="num">' + m[1] + '</span>' + h.innerHTML.slice(m[0].length);
    if (h.tagName === 'H4') return;
    const li = document.createElement('li'); const a = document.createElement('a');
    a.href = '#' + id; a.textContent = text; if (h.tagName === 'H3') a.className = 'sub';
    li.appendChild(a); toc.appendChild(li);
  });

  // Tables
  art.querySelectorAll('table').forEach(function (t) {
    const w = document.createElement('div'); w.className = 'table-wrap'; t.before(w); w.appendChild(t);
  });

  // Code blocks
  art.querySelectorAll('pre').forEach(function (pre) {
    const code = pre.querySelector('code');
    const lm = code && (code.className.match(/language-(\w+)/) || [])[1];
    const box = document.createElement('div'); box.className = 'code';
    const bar = document.createElement('div'); bar.className = 'code-bar';
    bar.innerHTML = '<i></i><i></i><i></i><span class="lang ' + (lm || 'text') + '">' + (lm || 'text') + '</span><span class="spacer"></span>';
    const btn = document.createElement('button'); btn.type = 'button'; btn.textContent = 'Copy';
    btn.addEventListener('click', function () {
      const done = function () { btn.textContent = 'Copied'; setTimeout(function () { btn.textContent = 'Copy'; }, 1400); };
      const fallback = function () { const r = document.createRange(); r.selectNodeContents(code); const s = getSelection(); s.removeAllRanges(); s.addRange(r); btn.textContent = 'Selected'; };
      try { navigator.clipboard.writeText(code.textContent).then(done, fallback); } catch (e) { fallback(); }
    });
    bar.appendChild(btn);
    pre.before(box); box.appendChild(bar); box.appendChild(pre);
    if (lm && window.hljs && hljs.getLanguage(lm)) hljs.highlightElement(code);
  });

  // Scenario cards
  const isHead = function (el) {
    return el.tagName === 'P' && el.children.length === 1 && el.firstElementChild.tagName === 'STRONG' &&
      el.textContent.trim() === el.firstElementChild.textContent.trim() && /^Scenario \d+/.test(el.textContent.trim());
  };
  let el = art.firstElementChild;
  while (el) {
    if (isHead(el)) {
      const card = document.createElement('section'); card.className = 'scenario';
      el.before(card); el.classList.add('scenario-head');
      const s = el.firstElementChild;
      s.innerHTML = s.innerHTML.replace(/^(Scenario \d+:)\s*/, '<span class="pill">$1</span> ');
      let n = el;
      while (n && !(n.tagName === 'HR' || /^H[1-6]$/.test(n.tagName) || n.classList.contains('scenario'))) {
        const next = n.nextElementSibling; card.appendChild(n); n = next;
      }
      el = n; continue;
    }
    el = el.nextElementSibling;
  }
  art.querySelectorAll('hr').forEach(function (hr) {
    const p = hr.previousElementSibling, n = hr.nextElementSibling;
    if ((p && p.classList.contains('scenario')) || (n && n.classList.contains('scenario'))) hr.remove();
  });
  art.querySelectorAll('.scenario').forEach(function (card) {
    const ansP = Array.from(card.querySelectorAll(':scope > p')).find(function (p) { return /^Answer:/.test(p.textContent.trim()); });
    if (!ansP) return;
    const correct = (ansP.textContent.match(/Answer:\s*([A-D])/) || [])[1];
    const det = document.createElement('details'); det.className = 'answer';
    det.innerHTML = '<summary>Reveal answer</summary>';
    ansP.before(det); det.appendChild(ansP);
    const ul = Array.from(card.querySelectorAll(':scope > ul')).find(function (u) { return /^[A-D]\.\s/.test(u.textContent.trim()); });
    if (!ul) return;
    ul.className = 'options';
    const items = Array.from(ul.children);
    items.forEach(function (li) {
      li.innerHTML = li.innerHTML.replace(/^([A-D]\.)\s/, '<span class="opt-key">$1</span><span>') + '</span>';
      li.dataset.key = li.textContent.trim().charAt(0);
      li.tabIndex = 0; li.setAttribute('role', 'button');
      const pick = function () {
        items.forEach(function (o) { o.classList.remove('wrong', 'correct'); });
        if (li.dataset.key !== correct) li.classList.add('wrong');
        items.forEach(function (o) { if (o.dataset.key === correct) o.classList.add('correct'); });
        det.open = true;
      };
      li.addEventListener('click', pick);
      li.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pick(); } });
    });
    det.addEventListener('toggle', function () {
      if (det.open) items.forEach(function (o) { if (o.dataset.key === correct) o.classList.add('correct'); });
    });
  });

  // Inline code pills, colour-coded by meaning
  const kinds = [
    ['k-bad', /error_|ResultError|ClaudeSDKError|^None$|RuntimeError|ValueError|OSError|is_error|max_tokens|eval\(\)|async_launched|BLOCKED|Handoff rejected|\['fusion'\]|^missing$|^partial$|complete: False|^empty$|^wrong$|^probe:|no structured output|^invented|^wrong\(/],
    ['k-ok', /end_turn|"success"|^success$|well_covered|complete: True|^correct$|already fine|^null$/],
    ['k-cap', /max_turns|max_budget_usd|MAX_TURNS|MAX_BUDGET_USD|MAX_ITERATIONS|max_iterations|COVERAGE_THRESHOLD|readOnlyHint|tools=\[|allowed_tools|setting_sources|ENABLE_TOOL_SEARCH|maxTurns|output_format|output_config|DISABLE_|MODEL_ID|with_agents|inherit|mcp_servers|agents=|^thinking$|agent_tool|approve_agent|SEQUENTIAL_RULE|PARALLEL_RULE|VERIFY_RULE|HANDOFF_RULE|^gate$|verify_rule|^handoff$|HANDOFF_FIELDS|PostToolUse|PreToolUse|HookMatcher|^hooks=|NORMALIZE_HOOKS|_SCHEMA$|FILE_REVIEW|CROSS_FILE_ISSUES|^\["(string|number)", "null"\]$|^"?unclear"?$|^"?other"?$|category_detail|^required$|ABSENT|CATEGORIES|EXTRACT_PROMPT|^RUNS$/],
    ['k-tool', /tool_use|tool_result|ToolUseBlock|ToolResultBlock|mcp__|calculator|web_search|@tool|_search_backend|_evaluate|^"?Agent"?$|^Task$|StructuredOutput|read_document|subagent_type|^web-searcher$|^doc-analyst$|^synthesizer$|list_documents|process_refund|get_customer|lookup_order|escalate_to_human|extract_invoice/],
    ['k-msg', /Message\b|TextBlock|ThinkingBlock|stop_reason|subtype|message\.result|\.result\b|structured_output|^\[(coordinator|web-searcher|doc-analyst|synthesizer)\]$|hand-back|agentId|<usage>|init_tools|message_id|system:init|hookSpecificOutput|updatedToolOutput|permissionDecision|tool_response|tool_input|^<(example|document|reasoning|extraction)>$/],
    ['k-fn', /query|ClaudeAgentOptions|build_options|run_agent|load_settings|asyncio|main\(\)|Settings|run_coordinator|research_once|decompose|delegate|build_coordinator_options|missing_categories|log_model_io|setup_logging|text_of|run_subagent|agent_loop|AgentDefinition|create_sdk_mcp_server|COORDINATOR_PROMPT|^AGENTS$|assess_coverage|coverage_percent|merge_sections|^research(\(\))?$|build_pipeline_options|parse_findings|parse_json_object|delegation_timing|coordinator_prompt|strip_metadata|check_metadata_passed|verify_attribution|diagnose|run_support|build_support_options|build_support_server|validate_handoff|SupportSession|verified_ids|normalize_output|normalize_record|to_iso|to_status|same_shape|parse_summary|response_text|build_hook_options|HookState|refund_limit|aml_gate|record_aml|load_repo|format_file|run_review|log_scores|flagged|build_review_options|multi_pass|REVIEWER_PROMPT|INTEGRATION_PROMPT|FILE_PROMPT|^extract(\(\))?$|^score(\(\))?$|run_arm|main_report|^cells(\(\))?$|^correct\(\)$|iso_dates|^accuracy(\(\))?$|examples_block|build_extract_options|_PROMPT$|^EXAMPLES$|^ARMS$|^TRUTH$|^DOCUMENTS$|DOC_TYPES|^_norm/]
  ];
  art.querySelectorAll(':not(pre) > code').forEach(function (c) {
    const t = c.textContent;
    for (let i = 0; i < kinds.length; i++) { if (kinds[i][1].test(t)) { c.classList.add(kinds[i][0]); break; } }
  });

  // Wrap each h2 and what follows into a coloured section
  const hues = ['--c1', '--c2', '--c3', '--c4', '--c5', '--c6'];
  let secIdx = 0, cur = null, node = art.firstElementChild;
  while (node) {
    const next = node.nextElementSibling;
    if (node.tagName === 'HR' && next && next.tagName === 'H2') { node.remove(); node = next; continue; }
    if (node.tagName === 'H2') {
      cur = document.createElement('section'); cur.className = 'sec';
      cur.style.setProperty('--sec', 'var(' + hues[secIdx++ % hues.length] + ')');
      node.before(cur);
    }
    if (cur) cur.appendChild(node);
    node = next;
  }
  toc.querySelectorAll('a').forEach(function (a) {
    const h = document.getElementById(a.getAttribute('href').slice(1));
    const sec = h && h.closest('.sec');
    if (sec) a.style.setProperty('--sec', sec.style.getPropertyValue('--sec'));
    a.insertAdjacentHTML('afterbegin', '<span class="dot"></span>');
  });

  // Collapse TOC on narrow screens
  if (window.matchMedia('(max-width: 1000px)').matches) document.getElementById('toc-details').open = false;

  // Progress + active TOC link
  const bar = document.getElementById('bar');
  const links = Array.from(toc.querySelectorAll('a'));
  const heads = links.map(function (a) { return document.getElementById(a.getAttribute('href').slice(1)); });
  let ticking = false;
  const update = function () {
    const max = document.documentElement.scrollHeight - innerHeight;
    bar.style.width = (max > 0 ? (scrollY / max) * 100 : 0) + '%';
    let cur = 0;
    heads.forEach(function (h, i) { if (h.getBoundingClientRect().top < 120) cur = i; });
    links.forEach(function (a, i) { a.classList.toggle('active', i === cur); });
    ticking = false;
  };
  addEventListener('scroll', function () { if (!ticking) { ticking = true; requestAnimationFrame(update); } }, { passive: true });
  update();
})();
</script>
