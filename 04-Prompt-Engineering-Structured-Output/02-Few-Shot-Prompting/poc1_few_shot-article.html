## 1. What this POC proves

This POC runs one A/B/C experiment. The same detailed extraction prompt goes to Claude three ways (no examples, examples as input/output pairs, examples with their reasoning) over the same 5 invoices in 3 structures. A scorer checks every field against known values, and a report sorts the problems into "fixed by examples" and "needs another technique". Every claim below is checked against one real run: `logs/poc1_few_shot_20261114_022842.log`.

| # | Idea | Where it shows up in the code |
|---|------|------------------------------|
| 1 | **Baseline first.** Detailed instructions with no examples are the control arm. Only the examples change between arms, so any difference comes from them. | `BASE_PROMPT`; `PAIRS_PROMPT` and `FEWSHOT_PROMPT` both start with it |
| 2 | **Diagnose before you prescribe.** The base arm's failures are tabulated by field and document structure, and each failing structure is mapped to the example that targets it. | `main_report()`: the `failure table` and `diagnosis:` lines |
| 3 | **Few-shot examples are text in the system prompt.** Three invoices that are not in the test set, one per structure (table, narrative, mixed). | `EXAMPLES`, `examples_block()` in `fewshot_setup.py` |
| 4 | **Examples with reasoning vs bare pairs.** The `few-shot` arm adds a `<reasoning>` element to each example; the `pairs` arm leaves it out. | `examples_block(with_reasoning)` |
| 5 | **Measure, don't eyeball.** Empty-field rate, ISO-date consistency and field accuracy per arm and per structure. | `score()`, `cells()`, `correct()`, `iso_dates()`, `accuracy()` |
| 6 | **Examples don't fix everything.** Missing data, a wrong sum in the source and malformed JSON each need another technique (nullable schema, validation loop, tool use). | the 6 `matrix ...` lines in `main_report()` |
| 7 | **The output channel is held constant.** Every arm returns schema-validated JSON through `output_format`, so a JSON syntax error can't be mistaken for an example failure. | `build_extract_options()` |

The pattern in one line:

```
same BASE_PROMPT ─┬─ + nothing                     ─▶ base     ─┐
                  ├─ + 3 examples (doc → JSON)      ─▶ pairs    ─┼─▶ score every field ─▶ failure table ─▶ comparison ─▶ decision matrix
                  └─ + 3 examples (doc → why → JSON) ─▶ few-shot ─┘
```

**What the real run showed, in one line:** the base arm was already 24/24, so the examples had no failures to fix. They still changed the output: with examples, Claude title-cased the vendor names the way the examples did, against the instruction "as written". Section 5 has the details.

What to notice in the real data:
- **The examples travel in the system prompt, not in the user prompt.** The `MODEL INPUT   system` line appears once per arm (02:28:42, 02:29:08, 02:29:39), and the `prompt` lines are identical in all three arms. The `pairs` system prompt has three `<example>` blocks without `<reasoning>`; the `few-shot` one has the same three blocks with it.
- **One document, one session.** Every call starts with its own `prompt` line and ends with its own `stop_reason` line. No call sees another document's extraction, so the only examples Claude has are the ones in the system prompt.
- **`success` with `stop_reason = "tool_use"`, 15 times out of 15.** Claude hands in the JSON by calling the built-in `StructuredOutput` tool, and the run ends right after that call is accepted. `extract()` checks only `subtype == "success"` and reads `structured_output`.
- **`tool_use_id` pairing.** Each `structured` line's `id` comes back as the `tool_use_id` of the next `tool_result` line. The result content is the SDK's acknowledgement `Structured output provided successfully`, a plain string, with `is_error=None`.
- **Thinking appears where the document is hard.** The log has `thinking` lines for N1, N2 (all arms) and M1 (`pairs`, `few-shot`), and none for T1 and T2 in any arm. The options turn on adaptive thinking (`thinking={"type": "adaptive", ...}`); the log only shows that no non-empty `ThinkingBlock` text arrived for the tables, not whether an empty block did.
- **In the base arm, M1's reasoning came as a `text` line**, not a `thinking` line: `02:29:06  MODEL OUTPUT  text  Issue date 30/09/2026 → 2026-09-30. Due 15 days later → 2026-10-15. Total 260 + 42 = 302.` It's the only `text` line in the log.
- **The score line comes 1–2 s after `stop_reason`.** `extract()` has no `break`, so the `async for` keeps reading until the stream closes after the `ResultMessage`; only then does `run_arm()` score and log. What arrived in that gap isn't logged.
- **Not shown:** `SystemMessage`s and other events also arrive in the stream (see the "No `break`" comment in `extract()`), but `log_model_io()` has no branch for them. Cost, session ids and turn counts are on the `ResultMessage` too, but the log records only `stop_reason` and `subtype`. The model name isn't logged either.

> The `UserMessage` items are **not** typed by a human. Here they carry only the SDK's acknowledgement of the `StructuredOutput` call.

## 4. Code walkthrough

The snippets follow the order in which the code runs: the script first, then the module functions it calls. Each one ends with the log lines it writes, copied from the real log (long values trimmed with `...`).

### 4.1 Module docstring: the experiment in one paragraph

```python
"""
POC 1 - Diagnose, then show, don't tell
=======================================
The same detailed extraction prompt runs three ways over 5 invoices in 3 structures (table, narrative, mixed):

    base       detailed instructions, no examples
    pairs      + 3 worked examples as input/output pairs
    few-shot   + the same 3 examples, each with the reasoning behind its extraction

First the base arm's failures are tabulated by document structure (diagnose before prescribing). Then the arms are
compared, and a decision matrix names the problems examples fix and the ones that need another technique.

Besides model I/O, the log shows one score line per extraction, the failure table, the comparison lines and the
decision matrix.

Run:  python poc1_few_shot.py     (3 runs, 5 query() calls each; 3 optional repeats)
"""
```

**Why it matters:** the docstring states the experiment's design before any code.
- **Three arms, one variable.** `pairs` and `few-shot` say "+": they add to the base prompt, they don't replace it. That is what makes the comparison fair.
- **The order is the lesson:** diagnose (failure table), then prescribe (examples), then check what examples can't fix (decision matrix).
- "3 runs, 5 query() calls each": 15 paid calls. The "3 optional repeats" are commented out in `ARMS` (4.3).

**Agentic concept:** a controlled prompt experiment. Change one thing, keep model, schema, documents and options fixed, and score against known values.

### 4.3 The run table: three arms, three structures

```python

    ("base", BASE_PROMPT),  # step 1: no examples
    ("pairs", PAIRS_PROMPT),  # the examples without their reasoning (C9)
    ("few-shot", FEWSHOT_PROMPT),  # step 3: the examples with their reasoning
    # ("base", BASE_PROMPT),  # optional: a second run of each arm shows format drift between runs (C4)
    # ("pairs", PAIRS_PROMPT),  # optional

TARGETS = {"table": "the table example", "narrative": "the narrative example", "mixed": "the mixed example"}

**Why it matters:**
- **`ARMS` is the experiment.** Each entry is `(label, system_prompt)`. The order (base → pairs → few-shot) is the order the log shows.
- **The repeats are optional.** `ClaudeAgentOptions` has no `temperature` or `seed` (README: "the SDK has no temperature or seed"), so the only way to see run-to-run format drift is to run an arm twice. Uncomment the last three lines and `main_report()` fills the `changed between runs` column. In the real run they were commented out, so the log says `changed between runs: n/a (1 run)`.
- **`TARGETS` is the diagnosis rule.** A failure on a narrative document points to the narrative example, and so on. `main_report()` uses it to write the `diagnosis:` line.

### 4.4 `run_arm()`: one system prompt, five documents

```python
async def run_arm(settings: Settings, label: str, system_prompt: str) -> dict[str, dict | None]:
    """Extract every document with one system prompt; log one score line per document."""
    log.info("MODEL INPUT   system       %s", system_prompt)  # the examples live in the system prompt
    run = {}
    for doc_id in DOCUMENTS:
        data = await extract(settings, system_prompt, doc_id)
        if data is None:
            log.error("%s %s: no structured output", label, doc_id)
        run[doc_id] = score(doc_id, data) if data is not None else None
        if run[doc_id]:
            log.info("%-8s %s (%s): %s", label, doc_id, DOC_TYPES[doc_id],
                     " ".join(f"{f}={v}" for f, v in run[doc_id]["verdicts"].items()))
    return run
```

**Why it matters:**
- **`MODEL INPUT   system`** is logged once per arm, because the system prompt doesn't change within an arm. It's the only place in the log where you can see the examples.
- **Documents run one after another,** each with its own `extract()` call. Nothing is shared between calls.
- **`None` is a failure, not a crash.** If a call returns no structured output, the arm logs `... no structured output` and records `None`; the scorer and report skip it. The real run has no such line.
- **The score line** (`%-8s` pads the label to 8 characters) is the bridge between model output and the report. It's the line to read first.

### 4.5 `cells()`, `correct()`, `iso_dates()`, `accuracy()`: the measures

```python
def cells(runs: list[dict]) -> list[tuple[str, str, str]]:
    """(doc, field, verdict) of every scored field; N2's due_date is the probe, so it is left out."""
    return [(d, f, v) for run in runs for d, s in run.items() if s for f, v in s["verdicts"].items()
            if not v.startswith("probe")]


def correct(runs: list[dict], docs: list[str] | None = None, fields: list[str] | None = None) -> tuple[int, int]:
    picked = [v for d, f, v in cells(runs) if (docs is None or d in docs) and (fields is None or f in fields)]
    return sum(v == "correct" for v in picked), len(picked)


def iso_dates(runs: list[dict]) -> tuple[int, int]:
    iso = [ok for run in runs for s in run.values() if s for ok in s["iso"]]
    return sum(iso), len(iso)


def accuracy(runs: list[dict], docs: list[str] | None = None, fields: list[str] | None = None) -> str:
    return "%d/%d" % correct(runs, docs, fields)
```

**Why it matters:**
- **`cells()` flattens the scores** into `(doc, field, verdict)` triples. 5 documents × 5 fields = 25, minus N2's `due_date` (the probe, which has no true value) = **24 scored fields per run**. That is the `/24` in the log.
- **`correct()` filters** by document and field, so the same function answers "accuracy on narrative documents" and "accuracy on T2's total".
- **`iso_dates()` counts format consistency** separately from correctness: how many non-empty dates match `YYYY-MM-DD`. N2's empty `due_date` is not counted, so the real run's denominator is 9, not 10.
- **`accuracy()`** only formats `correct()` as `ok/n`.

**Agentic concept:** evaluation by field, not by document. A document can be "mostly right"; a field is right or wrong, and a per-field tally shows where the problem sits.

### 4.6 `main_report()`: diagnose, compare, decide

#### a) The failure table and the diagnosis (base arm only)

```python
def main_report(scores: dict[str, list[dict]]) -> None:
    base = scores["base"]
    for field in FIELDS:  # the failure table: which fields fail on which structure (C5)
        row = []
        for structure in STRUCTURES:
            docs = [d for d in DOCUMENTS if DOC_TYPES[d] == structure]
            picked = [v for d, f, v in cells(base) if f == field and d in docs]
            row.append(f"{structure} {sum(v != 'correct' for v in picked)}/{len(picked)}")
        log.info("failure table %-12s %s", field, ", ".join(row))
    failing = sorted({DOC_TYPES[d] for d, f, v in cells(base) if v != "correct"}, key=STRUCTURES.index)
    log.info("diagnosis: %s", "; ".join(f"{s} failures -> {TARGETS[s]}" for s in failing) or "no base failures")
```

**Why it matters:** this is "diagnose before you prescribe" in code. One row per field, one column per structure, each cell `failures/scored`. Then the structures that failed at all are mapped to the example that should fix them. If nothing failed, the line says so instead of inventing a prescription.

### 4.7 `main()` and `__main__`

```python
async def main() -> int:
    try:
        settings = load_settings()
        setup_logging("poc1_few_shot")
    except (OSError, RuntimeError) as exc:
        print(f"Setup failed: {exc}")
        return 1

    scores = defaultdict(list)
    for label, system_prompt in ARMS:
        try:
            scores[label].append(await run_arm(settings, label, system_prompt))
        except ClaudeSDKError as exc:  # Claude Code not found, its process crashed, ...
            log.error("SDK error: %s", exc)
            return 1
    main_report(scores)
    return 0


if __name__ == "__main__":
    sys.exit(asyncio.run(main()))
```

**Why it matters:**
- **Setup failures use `print()`,** because the logger may not exist yet (a missing `.env` fails before `setup_logging()`).
- **`scores` is `{"base": [run], "pairs": [run], "few-shot": [run]}`**, one list per arm. A repeated arm appends a second run to the same list, which is what `changed between runs` compares.
- **Two failure boundaries.** A `ResultError` (an error result from one call) is caught inside `extract()` and becomes `None` for that document. A `ClaudeSDKError` (the runtime itself failed) stops the whole script with exit code `1`.
- **The report runs only after all three arms,** because every comparison needs all of them.

### 4.8 `Settings` and `load_settings()` (from `common.py`)

```python
@dataclass(frozen=True)
class Settings:
    model_id: str  # MODEL_ID: the Claude model that runs every extraction (the same model for every arm)
    max_turns: int  # MAX_TURNS: safety cap on turns per extraction call
    max_budget_usd: float  # MAX_BUDGET_USD: cost guard for a single run


def load_settings() -> Settings:
    """Read .env. The SDK's Claude Code process takes ANTHROPIC_API_KEY from the environment."""
    env_file = POC_DIR / ".env"
    if not env_file.is_file():
        raise RuntimeError(f"{env_file} not found: copy .env.example to .env and add your API key")
    load_dotenv(env_file, override=True)  # .env wins over variables already set in your shell
    if os.getenv("ANTHROPIC_API_KEY", "") in ("", "your-api-key-here"):
        raise RuntimeError(f"set ANTHROPIC_API_KEY in {env_file}")
    try:
        return Settings(
            model_id=os.getenv("MODEL_ID") or "claude-sonnet-5-5",
            max_turns=int(os.getenv("MAX_TURNS") or 5),
            max_budget_usd=float(os.getenv("MAX_BUDGET_USD") or 0.50),
        )
    except ValueError as exc:
        raise RuntimeError(f"MAX_TURNS and MAX_BUDGET_USD in .env must be numbers ({exc})") from exc
```

**Why it matters:**
- **One model for every arm.** A model change between arms would make the comparison meaningless. `frozen=True` means no code can change a setting mid-run.
- **The key never appears in code.** The SDK's Claude Code process reads `ANTHROPIC_API_KEY` from the environment that `load_dotenv()` filled.
- **Defaults:** `claude-sonnet-5-5`, 5 turns, $0.50 per call. An extraction needs one turn; the cap guards against a loop of failed `StructuredOutput` attempts.

### 4.9 `setup_logging()` and `log_model_io()` (from `common.py`)

```python
def setup_logging(script_name: str) -> None:
    """Log to the console and to logs/<script>_<time>.log, so a paid run can be re-read later."""
    log_dir = POC_DIR / "logs"
    log_dir.mkdir(exist_ok=True)
    log_file = log_dir / f"{script_name}_{datetime.now():%Y%m%d_%H%M%S}.log"
    formatter = logging.Formatter("%(asctime)s  %(message)s", datefmt="%H:%M:%S")
    for handler in (logging.StreamHandler(sys.stdout), logging.FileHandler(log_file, encoding="utf-8")):
        handler.setFormatter(formatter)
        log.addHandler(handler)
    log.setLevel(logging.INFO)


def log_model_io(message: Any) -> None:
    """Log the model input or output carried by one message from the query() stream."""
    if isinstance(message, AssistantMessage):  # Claude's response = model OUTPUT
        for block in message.content:
            if isinstance(block, ThinkingBlock) and block.thinking:
                log.info("MODEL OUTPUT  thinking     %s", block.thinking)
            elif isinstance(block, TextBlock):
                log.info("MODEL OUTPUT  text         %s", block.text)
            elif isinstance(block, ToolUseBlock) and block.name == "StructuredOutput":
                # output_format at work: Claude hands in its JSON through this built-in tool
                log.info("MODEL OUTPUT  structured   %s  (id=%s)", block.input, block.id)
            elif isinstance(block, ToolUseBlock):
                log.info("MODEL OUTPUT  tool_use     %s %s  (id=%s)", block.name, block.input, block.id)

    elif isinstance(message, UserMessage) and isinstance(message.content, list):  # tool results = model INPUT
        for block in message.content:
            if isinstance(block, ToolResultBlock):
                log.info(
                    "MODEL INPUT   tool_result  %s  (tool_use_id=%s, is_error=%s)",
                    block.content, block.tool_use_id, block.is_error,
                )

    elif isinstance(message, ResultMessage):  # the loop has ended
        log.info("MODEL OUTPUT  stop_reason  %s  (loop result: %s)", message.stop_reason, message.subtype)
```

**Why it matters:**
- **The file name** `poc1_few_shot_20261114_022842.log` comes from `datetime.now()` at setup: the run started at 02:28:42, the time of the first log line.
- **`structured` is a `ToolUseBlock` with a special name.** With `output_format`, the final JSON isn't text: Claude calls a built-in tool named `StructuredOutput`, and its `input` is the JSON. That's why the log tag is `structured`, not `tool_use`.
- **`thinking` only when non-empty.** An empty `ThinkingBlock` writes nothing, so the log can't tell "no block" from "empty block".
- **One line per block**, always with the `id` / `tool_use_id`, so request and result can be paired by eye.

#### b) `EXTRACTION_SCHEMA`: required everywhere, nullable nowhere

```python

    "type": "object",
    "properties": {
        "vendor_name": {"type": "string"},
        "invoice_date": {"type": "string"},
        "due_date": {"type": "string"},
        "total_amount": {"type": "number"},
        "line_items": {"type": "array", "items": {

**Why it matters:** this schema is deliberately the "before" design. `due_date` is a required `string` with no `null`, so for N2 Claude has only two options: invent a date, or return an empty string that looks like a value. Neither says "not in the document". In the real run Claude chose `''` in all three arms (section 5). No example can add a `null` the schema forbids; that's the topic-03 fix.

**Anti-pattern it exposes:** required, non-nullable fields for data that may be absent. They force fabrication or fake blanks.

def examples_block(with_reasoning: bool) -> str:
    """Each example: the document, (the reasoning,) and the extraction. Pairs leave the reasoning out (C9)."""
    return "Worked examples:\n" + "\n".join(
        f"<example>\n<document>\n{e['document']}\n</document>\n"
        + (f"<reasoning>{e['reasoning']}</reasoning>\n" if with_reasoning else "")
        + f"<extraction>{json.dumps(e['extraction'])}</extraction>\n</example>" for e in EXAMPLES)


PAIRS_PROMPT = BASE_PROMPT + "\n\n" + examples_block(False)  # input/output pairs only
FEWSHOT_PROMPT = BASE_PROMPT + "\n\n" + examples_block(True)  # the same examples, with their reasoning
```

**Why it matters:**
- **One example per structure** (table, narrative, mixed), each targeting the patterns the base arm is expected to miss: dates and numbers in words, a complimentary item, a relative due date, a DD/MM date, an item in a note.
- **Not from the test set.** Different vendors and figures, so a correct test answer can't be copied from an example. The model must transfer the rule.
- **The reasoning states the rule, not just the answer:** "complimentary, so nothing is billed and they are not a line item"; "plus 14 days is 2026-08-19"; "the total matches 8 x 25.00 + 4 x 6.50". That's what's supposed to generalize to N1's free poles and M1's 15-day terms.
- **XML tags** (`<example>`, `<document>`, `<reasoning>`, `<extraction>`) separate the parts so Claude can't confuse an example document with the real one, which arrives in the user prompt inside its own `<document>` tag.
- **`PAIRS_PROMPT` and `FEWSHOT_PROMPT` are `BASE_PROMPT + ...`.** No arm has more instructions than another; only the examples differ. That's the control behind the `Same instructions in every arm` line.

**Note what the examples also teach:** each example's `extraction` writes the vendor in title case (`"Brightline Packaging"` for `BRIGHTLINE PACKAGING`, `"Cascade Filters Ltd"` for `CASCADE FILTERS LTD`). None of the reasoning texts mentions that choice. Section 5 shows Claude copying it.

**Agentic concept:** few-shot prompting. Examples show the expected output format and the decisions behind it more reliably than more instruction text.

### 4.11 `build_extract_options()`: each option is a decision

```python
def build_extract_options(settings: Settings, system_prompt: str) -> ClaudeAgentOptions:
    return ClaudeAgentOptions(
        model=settings.model_id,  # one model for every arm
        system_prompt=system_prompt,  # the ONLY thing that changes between arms: the examples live here
        output_format={"type": "json_schema", "schema": EXTRACTION_SCHEMA},  # validated JSON: syntax never varies (E1)
        tools=[],  # no built-in tools: the document is in the prompt
        setting_sources=[],  # ignore ~/.claude settings, CLAUDE.md and hooks: the same run on any machine
        env={"ENABLE_TOOL_SEARCH": "false"},  # no ToolSearch calls
        thinking={"type": "adaptive", "display": "summarized"},  # return Claude's reasoning text (same cost)
        max_turns=settings.max_turns,  # safety cap (01 C16)
        max_budget_usd=settings.max_budget_usd,  # cost guard per extraction call
    )
```

| Option | Effect | Agentic concept |
|--------|--------|-----------------|
| `model=settings.model_id` | Same model in every arm | Controlled experiment |
| `system_prompt=system_prompt` | Replaces the whole system prompt with the arm's prompt | Few-shot examples as system-prompt text |
| `output_format={"type": "json_schema", ...}` | Claude must call `StructuredOutput`; the SDK validates against the schema; the JSON lands in `ResultMessage.structured_output` | Structured output through a tool: JSON syntax can't vary between arms |
| `tools=[]` | No built-in tools (no file reads, no shell) | Least privilege; the document is in the prompt |
| `setting_sources=[]` | No user/project settings, `CLAUDE.md` or hooks | Reproducibility on any machine |
| `env={"ENABLE_TOOL_SEARCH": "false"}` | No ToolSearch calls | A clean stream: only the extraction |
| `thinking={"type": "adaptive", "display": "summarized"}` | Claude decides when to think; summaries come back as `ThinkingBlock` | Observability of the model's reasoning |
| `max_turns=settings.max_turns` | Caps turns per call | Safety cap |
| `max_budget_usd=settings.max_budget_usd` | Stops a call whose estimated spend passes the cap | Cost guard |

**Why it matters:** `system_prompt` is the only argument that depends on the arm. If `output_format` were missing, a JSON parse error in one arm would look like "the examples made it worse", when the output channel failed. With it, the `malformed JSON` matrix row is 0 by construction.

### 4.12 `extract()`: one document, one new session

```python
async def extract(settings: Settings, system_prompt: str, doc_id: str) -> dict | None:
    """One document = one query() = one NEW session: no other document, and no example but the prompt's."""
    prompt = f"Extract the invoice below.\n\n<document>\n{DOCUMENTS[doc_id]}\n</document>"
    log.info("MODEL INPUT   prompt       %s", prompt)
    data = None
    try:
        async for message in query(prompt=prompt, options=build_extract_options(settings, system_prompt)):
            log_model_io(message)
            if isinstance(message, ResultMessage) and message.subtype == "success":
                data = message.structured_output  # None here means no structured output: treat it as a failure
            # No `break`: a few system events can still arrive after the ResultMessage.
    except ResultError as exc:  # raised AFTER the error ResultMessage, e.g. error_max_structured_output_retries
        log.error("The extraction failed: %s", exc)
    return data
```

**Why it matters:**
- **A new session per document.** Each `query()` starts with an empty history. Earlier extractions can't act as accidental examples, so the only shots are the ones in `system_prompt`.
- **The user prompt is identical across arms.** Only the system prompt differs, which the log confirms.
- **`subtype == "success"` is the completion check,** not `stop_reason`. With `output_format`, a successful run ends with `stop_reason == "tool_use"` (section 3.2).
- **No `break`.** Events can still arrive after the `ResultMessage`; the loop reads to the end of the stream.
- **`ResultError` after an error result.** If Claude can't produce schema-valid JSON in time, the SDK yields an error `ResultMessage` (e.g. `error_max_structured_output_retries`) and then raises. `extract()` logs it and returns `None`.

### 4.13 `score()`: correct, empty, wrong, or probe

```python
ISO_DATE = re.compile(r"^\d{4}-\d{2}-\d{2}$")


def _norm(name: str) -> str:
    return re.sub(r"[^a-z0-9 ]", "", name.lower())


def score(doc_id: str, data: dict) -> dict[str, Any]:
    """Per field: correct, empty or wrong. N2's due_date has no true value: it keeps its raw value (the probe)."""
    truth, verdicts = TRUTH[doc_id], {}
    for field in FIELDS:
        value = data.get(field)
        if field == "due_date" and truth[field] is None:
            verdicts[field] = f"probe:{value!r}"  # fabrication probe (C15)
        elif value in ("", [], 0, None) or (isinstance(value, str) and not value.strip()):
            verdicts[field] = "empty"
        elif field == "vendor_name":
            verdicts[field] = "correct" if _norm(truth[field]) in _norm(value) else "wrong"
        elif field == "total_amount":
            verdicts[field] = "correct" if abs(value - truth[field]) < 0.01 else "wrong"
        elif field == "line_items":
            pairs = sorted((round(i["quantity"], 2), round(i["unit_price"], 2)) for i in value)
            verdicts[field] = "correct" if pairs == sorted(truth[field]) else "wrong"
        else:
            verdicts[field] = "correct" if value == truth[field] else "wrong"
    dates = [data.get(f) for f in ("invoice_date", "due_date") if data.get(f)]
    return {"verdicts": verdicts, "iso": [bool(ISO_DATE.match(d)) for d in dates], "data": data}
```

| Field | Rule | What it forgives |
|-------|------|------------------|
| `vendor_name` | the normalized true name is contained in the normalized value | case and punctuation (`RIDGEWAY SHELVING CO.` = `Ridgeway Shelving Co.`) |
| dates | exact string match | nothing: `2026-10-03` only |
| `total_amount` | within 0.01 | `1330` vs `1330.00` |
| `line_items` | same `(quantity, unit_price)` pairs, any order | descriptions and order |
| N2 `due_date` | not judged: `probe:<raw value>` | n/a |

**Why it matters:**
- **`empty` is separate from `wrong`.** The curriculum's symptom is "empty or wrong on narrative"; the two need different fixes.
- **The probe keeps the raw value** (`probe:''` or `probe:'2026-10-18'`), so you see exactly how Claude handled a value that doesn't exist.
- **`iso` is measured on the raw dates,** separately from correctness.
- **`data` is kept,** so the report can compare raw values between runs and sum T2's line items.

**Trade-off to know:** a forgiving scorer hides surface drift. `_norm()` lowercases, so the vendor-name casing change in section 5 scores `correct` in every arm. To catch it, compare raw values (as `changed between runs` does) or tighten the rule.

## 6. Agentic AI concepts recap

| Concept | How this POC shows it |
|---------|-----------------------|
| **Baseline before intervention** | The `base` arm runs first with detailed instructions and no examples; every other arm is compared with it. |
| **Diagnose before prescribing** | `failure table` per field and structure, then `diagnosis:` maps each failing structure to its example (`TARGETS`). |
| **Few-shot examples** | Three worked invoices in the system prompt, one per structure, not taken from the test set. |
| **Examples with reasoning** | `<reasoning>` states how each value was found and which rule applied; `pairs` leaves it out to isolate its effect. |
| **Examples steer format** | The real run: the examples' title-cased vendors overrode "as written" in both example arms. |
| **Controlled comparison** | Same model, schema, documents, options and user prompt; `PAIRS_PROMPT` and `FEWSHOT_PROMPT` start with `BASE_PROMPT`. |
| **Session isolation** | One `query()` per document: earlier extractions can't act as examples. |
| **Structured output** | `output_format` → `StructuredOutput` → `structured_output`; final `stop_reason` is `tool_use`. |
| **Measured evaluation** | Per-field verdicts against `TRUTH`; empty rate, ISO rate, accuracy, per structure. |
| **Technique-to-problem matching** | The decision matrix: examples for consistency, nullable schema for missing data, validation loop for sum errors, tool use for JSON. |
| **Schema forces behaviour** | Required, non-nullable `due_date` → `''` for N2 in every arm. |
| **Observability** | One log line per model input or output plus the score and report lines; adaptive thinking shows the model's checks. |

## 7. Common mistakes this POC helps you avoid

1. **Adding more instructions to fix inconsistency.** The arms keep the instructions identical and change only the examples, because examples are the first-choice fix.
2. **Prescribing before diagnosing.** Writing examples without knowing which fields fail on which structure. The failure table comes first; in this run it said there was nothing to fix.
3. **Assuming the baseline fails.** A strong model on clean documents may already be right. Measure first; don't pay for examples you don't need.
4. **Using test documents as examples.** The examples are different invoices, so a correct answer must come from the rule, not a copy.
5. **Bare input/output pairs when the decision needs a rule.** Pairs teach surfaces (the run shows it: title case was copied without any reasoning).
6. **Letting examples contradict the instructions.** "As written" in the prompt, title case in the examples: the examples won. Make every example obey every instruction.
7. **Expecting examples to stop fabrication.** If the schema has no `null`, Claude must invent a value or return a fake blank. Change the schema.
8. **Expecting examples to fix a source error.** T2's total was wrong in the document; every arm copied it. That needs a validation check and retry.
9. **Blaming the examples for malformed JSON.** Hold the output channel constant with `output_format` (or a forced tool).
10. **Checking `stop_reason == "end_turn"` for structured output.** All 15 successful calls ended with `tool_use`.
11. **A scorer that hides the change you care about.** Case-insensitive vendor matching scored the casing change as `correct`. Keep raw values and compare them.
12. **One run per arm for "format drift".** Without temperature or seed in the SDK, drift between runs needs repeated runs (the optional `ARMS` entries).

### 8.1 What the exam tests on this topic

The objectives come from `curriculum/04-Prompt-Engineering-Structured-Output/02-raw-Few-Shot-Prompting.md`. This POC covers all five.

| Exam objective | What a correct answer looks like | Where this POC shows it |
|----------------|----------------------------------|-------------------------|
| 1. Base prompt with detailed instructions, no examples, against 5 varied documents | Instructions alone are inconsistent across structures (right from tables, empty or wrong from narrative, formats that drift between runs). That inconsistency is the trigger for few-shot. | `BASE_PROMPT`, `DOCUMENTS`, the `base` arm. Real run: 24/24, so no trigger fired |
| 2. Record which fields fail on which document type | Diagnose before prescribing: a table of field × structure tells you what the examples must demonstrate. | `failure table` lines, `diagnosis:` line, `TARGETS` |
| 3. 3 examples targeting the failing patterns, each with reasoning | One example per structure, each showing where the data was and why each decision was made. Reasoning generalizes; bare pairs teach surface matching. | `EXAMPLES`, `examples_block(True)`; the `pairs` arm as the control |
| 4. Re-run and compare empty rate, format consistency, accuracy | Few-shot is the first-choice technique for consistency problems and beats more instructions. The biggest gain is on the structures that failed. | comparison and `by structure` lines; `Same instructions in every arm` |
| 5. Decision matrix: what examples fix and what they don't | Examples: consistency and structural variety. Malformed JSON → tool use. Fabricated values → nullable schema. Sum discrepancies → validation loops. | the 6 `matrix` lines |

> **Exam tip:** the exam usually describes few-shot examples in the raw Messages API, where they sit in the `system` string or as earlier `user`/`assistant` turns, and structured output as a forced tool (`tool_choice`). The POC uses the Agent SDK's `system_prompt` and `output_format`. The rules are the same: examples in the prompt, JSON through a tool, and a schema that decides what Claude is allowed to say.

### 8.2 The same experiment with the raw Messages API

With the raw API, one extraction is one `messages.create()` call. Structured output is a forced tool call, the technique the matrix's `malformed JSON` row names (topic 03).

```python
import anthropic

client = anthropic.Anthropic()
# MODEL_ID, DOCUMENTS, EXTRACTION_SCHEMA, BASE_PROMPT, PAIRS_PROMPT and FEWSHOT_PROMPT are as in the POC.

RECORD_INVOICE = {
    "name": "record_invoice",
    "description": "Record the fields extracted from one invoice.",
    "input_schema": EXTRACTION_SCHEMA,
}


def extract(system_prompt: str, doc_id: str) -> dict | None:
    response = client.messages.create(
        model=MODEL_ID,
        max_tokens=4096,
        system=system_prompt,  # BASE_PROMPT, PAIRS_PROMPT or FEWSHOT_PROMPT: the examples live here
        messages=[{"role": "user",  # a new list per call: no other document's extraction in the context
                   "content": f"Extract the invoice below.\n\n<document>\n{DOCUMENTS[doc_id]}\n</document>"}],
        tools=[RECORD_INVOICE],
        tool_choice={"type": "tool", "name": "record_invoice"},  # forced: the reply is always this tool call
    )
    for block in response.content:  # stop_reason is "tool_use", as in the POC
        if block.type == "tool_use":
            return block.input  # the JSON, already shaped by input_schema
    return None


scores = {label: {d: score(d, extract(prompt, d)) for d in DOCUMENTS}
          for label, prompt in (("base", BASE_PROMPT), ("pairs", PAIRS_PROMPT), ("few-shot", FEWSHOT_PROMPT))}
```

| Raw Messages API (you write it) | Agent SDK (`poc1_few_shot.py` + `fewshot_setup.py`) |
|---------------------------------|-----------------------------------------------------|
| `system=FEWSHOT_PROMPT` | `system_prompt=system_prompt` in `build_extract_options()` |
| Examples could also go in as earlier `user`/`assistant` turns in `messages` | Examples are only in the system prompt; each `query()` starts a new session |
| A new `messages` list per call | A new session per `query()` call |
| Your own tool + `tool_choice={"type": "tool", ...}` | `output_format={"type": "json_schema", ...}` → built-in `StructuredOutput` tool |
| `block.input` of the `tool_use` block | `ResultMessage.structured_output` |
| `stop_reason == "tool_use"` | Final `stop_reason == "tool_use"`, `subtype == "success"` |
| You validate the input yourself, or retry | The SDK validates against the schema; failure → `error_max_structured_output_retries` + `ResultError` |
| `temperature` is available | No `temperature` or `seed` in `ClaudeAgentOptions`: repeat runs to see drift |
| One call, nothing to cap | `max_turns` and `max_budget_usd` per call |
| `thinking=...` parameter (not combined with a forced tool) | `thinking={"type": "adaptive", "display": "summarized"}` |

Two things the raw version makes obvious:
- **The examples are just text in the request.** Nothing in the API "knows" they are examples; their effect comes from what they show, which is why an example that contradicts an instruction (the vendor casing) wins.
- **The schema decides what can be said.** `input_schema` with a required `due_date` string gives Claude no way to answer "none", in either API.

### 8.3 Scenario questions

Try each one before reading the answer. These questions were written for this article to match the curriculum objectives above. They are not official exam questions.

---

**Scenario 1: Right from tables, wrong from letters**

An invoice extractor with detailed field instructions gets every field right on tabular invoices, but on invoices written as letters it leaves `line_items` empty and returns due dates as text such as "30 days". What should you try first?

- A. Add more detailed instructions about letters to the system prompt.
- B. Add 2–3 few-shot examples, including a letter-style invoice, each with reasoning that shows where the values were found and how the due date was computed.
- C. Switch to a larger model.
- D. Split the extractor into one prompt per document type.

**Answer: B.** Inconsistent output across document structures, with good instructions already in place, is the trigger for few-shot examples: they show the expected output and the decisions behind it. A adds more of what already failed. C and D are heavier changes that skip the first-choice fix. *POC link:* `EXAMPLES` holds one narrative example whose reasoning covers numbers in words, a free item and a relative due date; the `pairs` and `few-shot` arms add it without changing `BASE_PROMPT`.

---

**Scenario 2: Where to start**

A team says their extraction is "inconsistent" and wants to write examples today. They have no breakdown of which fields fail where. What should they do first?

- A. Write examples for all fields on all document types.
- B. Run the current prompt over a varied test set with known values and record which fields are empty or wrong on which document structure.
- C. Raise `max_tokens`.
- D. Ask the model to rate its own consistency.

**Answer: B.** Diagnose before prescribing: the failure pattern tells you what the examples must demonstrate. Without it, examples may target problems you don't have. *POC link:* the 5 `failure table` lines and the `diagnosis:` line in `main_report()`. In the real run the diagnosis was `no base failures`, so writing examples would have fixed nothing.

---

**Scenario 3: Pairs or reasoning?**

Two prompt variants use the same 3 examples. Variant X shows each document and its JSON. Variant Y adds, for each example, a short explanation of where each value came from and why (e.g. "the carry bags are complimentary, so they are not a line item"). On new documents with patterns no example shows exactly, which should generalize better, and why?

- A. X, because shorter prompts are always better.
- B. Y, because the reasoning teaches the rule behind each decision, while bare pairs teach surface pattern matching.
- C. Both are the same, because the JSON is identical.
- D. Neither; only fine-tuning generalizes.

**Answer: B.** This is the curriculum's point: reasoning-included examples outperform input/output pairs on novel patterns. *POC link:* the `pairs` vs `few-shot` arms and the `reasoning vs pairs ...` line. In the real run they tied (`1/1 + 4/4 + 1/1` each), because the base arm already got everything right; the gap shows only where there is something to learn.

---

**Scenario 4: The example that overrode the instruction**

The system prompt says "vendor_name: the company name, as written". After adding three examples, all-caps vendors like `ACME SUPPLY` now come back as `Acme Supply`. What happened?

- A. The model ignores system prompts once examples are present.
- B. The examples' extractions write the vendor in title case, and Claude followed the examples' format over the instruction.
- C. `output_format` changes string casing.
- D. The JSON schema lowercases strings.

**Answer: B.** Examples are strong format signals. When an example contradicts an instruction, the output tends to follow the example. Fix the examples so they obey every instruction (or change the instruction). *POC link:* the real run: base returned `RIDGEWAY SHELVING CO.` and `HOLLIS PEST CONTROL`, while `pairs` and `few-shot` returned `Ridgeway Shelving Co.` and `Hollis Pest Control`, matching `"Brightline Packaging"` and `"Cascade Filters Ltd"` in `EXAMPLES`.

---

**Scenario 5: The invented due date**

An invoice has no due date. The schema marks `due_date` as a required string. After adding few-shot examples, the extractor still returns either an empty string or a plausible date like "2026-10-18". What is the right fix?

- A. Add an example of an invoice with no due date.
- B. Make `due_date` nullable (`["string", "null"]`) and tell the model to return `null` when the document has no value.
- C. Add "never invent data" in capitals to the prompt.
- D. Lower the temperature.

**Answer: B.** Fabrication of missing data is a schema problem: a required, non-nullable field leaves no honest answer. Examples don't add a `null` the schema forbids. A could show an empty string, but that's still not `null`. *POC link:* `EXTRACTION_SCHEMA` (no `"null"` type) and the matrix line `missing data (N2 due) base probe:''  few-shot probe:''  fixed by examples: no  -> nullable schema fields (topic 03)`. Claude's thinking said "I'd rather not invent one", and the only option left was `''`.

---

**Scenario 6: The total that doesn't add up**

A supplier's invoice lists items summing to 445.00 and states a total of 455.00. Every prompt variant, with or without examples, returns 455.00. What's the right technique?

- A. More few-shot examples with correct totals.
- B. Extract the stated total and the items, then check in code that they match; on a mismatch, retry with the specific error or flag it for review.
- C. Tell the model to always compute the total itself.
- D. Use a bigger model.

**Answer: B.** A sum discrepancy is in the source document. Examples can't fix it, and silently "correcting" it (C) hides a real billing error. A validation check with a retry or flag catches it. *POC link:* the matrix line `sum discrepancy (T2)  base items 445.00 vs total 455 ... -> validation and retry loop (topic 04)`.

---

**Scenario 7: Malformed JSON**

An extractor that returns JSON as free text breaks about 1 call in 50 with a trailing comma. A colleague suggests adding more examples of valid JSON. What do you recommend?

- A. More examples of valid JSON.
- B. Return the JSON through a tool: a forced tool call with an `input_schema` (or the Agent SDK's `output_format`), so the output is always schema-shaped.
- C. Parse with a lenient JSON parser and ignore the errors.
- D. Lower `max_tokens`.

**Answer: B.** Malformed JSON is an output-channel problem; tool use fixes it structurally. Examples improve consistency but can't guarantee syntax. *POC link:* `output_format` in `build_extract_options()`; the matrix line `malformed JSON  base 0  few-shot 0 calls without structured output`.

---

**Scenario 8: Proving the examples helped**

After adding few-shot examples, a team says extraction "looks better". Which measurement shows whether the examples worked?

- A. Count the tokens in each response.
- B. Re-run the same documents with the same model, schema and instructions, and compare empty-field rate, format consistency and per-field accuracy against known values, per document structure.
- C. Ask users which output they prefer.
- D. Check that every call ends with `stop_reason == "end_turn"`.

**Answer: B.** A fair comparison changes only the examples and measures the three things the curriculum names, by structure, so you can see the gain where the baseline failed. D is wrong twice: completion isn't quality, and with structured output the final `stop_reason` is `tool_use`. *POC link:* the `<arm> empty ... ISO dates ... accuracy ...` and `<arm> by structure:` lines; `PAIRS_PROMPT` and `FEWSHOT_PROMPT` both start with `BASE_PROMPT`.

---

**Scenario 9: Examples copied from the test set**

To get a quick win, an engineer writes few-shot examples from three of the five test invoices. Accuracy jumps to 100%. What's wrong with this?

- A. Nothing; 100% is the goal.
- B. The test now measures copying, not generalization: the model can reproduce the example answers. Examples must come from documents outside the test set.
- C. Examples must always be longer than the test documents.
- D. Few-shot examples only work on tables.

**Answer: B.** Examples taken from the test set leak the answers. The POC uses three different invoices (Brightline, Juniper, Cascade) so that a correct test answer must come from the rule. *POC link:* `EXAMPLES` comment: "3 invoices that are NOT in the test set".

---

**Scenario 10: The baseline is already perfect**

A team runs the full experiment and the baseline (detailed instructions, no examples) scores 100% on every field. The few-shot arm also scores 100%. What should they conclude?

- A. Few-shot prompting doesn't work.
- B. On these documents the instructions are enough; there's no consistency problem for examples to fix. Test harder or more varied documents (and repeat runs for drift) before adding examples, and keep the problems examples can't fix on the list.
- C. Remove the instructions and keep only the examples.
- D. Always add examples anyway; they never hurt.

**Answer: B.** Few-shot is the first-choice fix for a consistency problem, not a ritual. Without a measured failure there's nothing to prescribe. D is wrong because examples do change behaviour, sometimes against the instructions. *POC link:* the real run: `diagnosis: no base failures`, `fixed by examples: already fine` on the first three matrix rows, and the vendor-casing change in both example arms.

---

### 8.4 Quick-recall cheat sheet

```
trigger for few-shot     → good instructions, still inconsistent across document structures
diagnose first           → field × structure failure table; each failing structure → one targeted example
examples                 → 2-4, one per structure, NOT from the test set, wrapped in <example> tags
with reasoning           → where each value was found + the rule applied → generalizes to new patterns
bare input/output pairs  → surface pattern matching (they still copy format: title-cased vendors)
examples vs instructions → examples win; make every example obey every instruction
measure                  → empty rate, format consistency (ISO dates), per-field accuracy, by structure
fair comparison          → same model, schema, documents, instructions; only the examples change
examples DON'T fix       → malformed JSON → tool use / output_format
                           missing data invented / faked → nullable schema fields
                           sum discrepancies in the source → validation + retry loop
SDK structured output    → output_format → StructuredOutput tool → structured_output; stop_reason "tool_use"
SDK has no temperature   → repeat runs to see format drift
```

---

## 9. How to run it

```bash
cd 04-Prompt-Engineering-Structured-Output/02-Few-Shot-Prompting
python3 -m venv .venv && source .venv/bin/activate   # Python 3.10+
pip install -r requirements.txt                      # claude-agent-sdk >=0.2.174,<0.3 and python-dotenv
cp .env.example .env                                 # then put your API key in .env
python poc1_few_shot.py                              # paid: 3 arms × 5 documents = 15 query() calls
```

- The script calls the API. This folder has no free offline demo.
- `.env` needs `ANTHROPIC_API_KEY`. `MODEL_ID`, `MAX_TURNS` and `MAX_BUDGET_USD` fall back to `claude-sonnet-5-5`, `5` and `0.50`.
- To measure format drift between runs, uncomment the three optional entries in `ARMS`: 30 calls, and the `changed between runs` column gets a number.
- Every model input and output, the score lines and the report are printed to the console and written to `logs/poc1_few_shot_<date>_<time>.log`. Expect different wording in thinking and descriptions on each run; with a strong model the scores may again be 24/24.
- The exit code is `0` when all arms finish (failed extractions are logged and skipped, not fatal). It's `1` on a setup failure (`OSError`, `RuntimeError`) or an SDK runtime failure (`ClaudeSDKError`).
